---
# Clean-room CI builds of the waydroid-nvidia components that are fully
# scripted today (see packaging/aur/PREREQS.md): the dual-ABI guest Venus drivers
# (mesa), the host renderer (virglrenderer) and the gralloc backend.
# Each job reproduces the stranger's path: fetch upstream at the pinned
# BASE commit, apply patches/, build via the same build/<comp>/build.sh
# the dev loop uses (one recipe, see packaging/aur/README.md).
#
# On v* tags the release job packages the artifacts with SHA256SUMS and a
# SLSA build-provenance attestation, so users can verify that a downloaded
# binary was built by THIS workflow from THIS repo:
#   gh attestation verify <file> --repo <owner>/waydroid-nvidia
#
# Every component is CI-built: mesa/virgl/gralloc/hwcomposer on hosted
# runners (hwcomposer via build/hwcomposer/provision.sh clean-room), ANGLE
# on tags/dispatch (~2 h), surfaceflinger on the maintainer's self-hosted
# runner (label: lineage) holding the lineage-20 tree.
name: build

on:
  push:
    branches: [main, ci-aur]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesa:
    name: guest venus driver (mesa, ${{ matrix.android_abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_abi: x86_64
            android_libdir: lib64
            elf_class: ELF64
            elf_machine: Advanced Micro Devices X86-64
          - android_abi: x86
            android_libdir: lib
            elf_class: ELF32
            elf_machine: Intel 80386
    steps:
      - uses: actions/checkout@v4
      - name: Load pins
        run: cat packaging/ci/pins.env | grep -v '^#' >> "$GITHUB_ENV"
      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-ndk
          key: ndk-${{ env.NDK_VERSION }}
      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfLo ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          sha256sum ndk.zip
          if [ -n "$NDK_ZIP_SHA256" ]; then echo "$NDK_ZIP_SHA256  ndk.zip" | sha256sum -c; fi
          unzip -q ndk.zip -d "$HOME"
          mv "$HOME/android-ndk-${NDK_VERSION}" "$HOME/android-ndk"
      - name: Host deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build python3-mako python3-yaml python3-pip bison flex pkg-config zstd glslang-tools
          pipx install meson  # mesa needs meson >= 1.4.0; ubuntu-24.04 apt has 1.3.2
          pipx inject meson mako packaging pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch mesa at pinned base
        run: |
          git init -q mesa-src
          git -C mesa-src fetch -q --depth 1 "$MESA_UPSTREAM" "$MESA_SHA"
          git -C mesa-src checkout -q FETCH_HEAD
          git -C mesa-src config user.email ci@waydroid-nvidia
          git -C mesa-src config user.name ci
          git -C mesa-src am "$GITHUB_WORKSPACE"/patches/mesa/0001-*.patch "$GITHUB_WORKSPACE"/patches/mesa/0002-*.patch
          git -C mesa-src apply "$GITHUB_WORKSPACE"/patches/mesa/0003-*.patch
      - name: Build libvulkan_virtio.so
        run: |
          mkdir -p "$RUNNER_TEMP/empty-pkgconfig"
          ANDROID_ABI="${{ matrix.android_abi }}" NDK="$HOME/android-ndk" \
            NDK_PKGCONFIG="$RUNNER_TEMP/empty-pkgconfig" \
            ./build/mesa/build.sh "$PWD/mesa-src" "$PWD/mesa-build-${{ matrix.android_abi }}"
      - name: Verify and stage artifact
        run: |
          src="mesa-build-${{ matrix.android_abi }}/src/virtio/vulkan/libvulkan_virtio.so"
          readelf -h "$src" | grep -q "Class:.*${{ matrix.elf_class }}"
          readelf -h "$src" | grep -q "Machine:.*${{ matrix.elf_machine }}"
          readelf -d "$src" | grep -q 'SONAME.*libvulkan_virtio.so'
          mkdir -p "stage/vendor/${{ matrix.android_libdir }}/hw"
          cp -L "$src" "stage/vendor/${{ matrix.android_libdir }}/hw/vulkan.virtio.so"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-vulkan-virtio-${{ matrix.android_abi }}
          path: stage/
          if-no-files-found: error

  virglrenderer:
    name: host venus renderer (virglrenderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load pins
        run: cat packaging/ci/pins.env | grep -v '^#' >> "$GITHUB_ENV"
      - name: Host deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq meson ninja-build pkg-config python3-yaml zstd \
            libepoxy-dev libdrm-dev libgbm-dev libegl-dev libgles-dev libvulkan-dev libx11-dev libwayland-dev
      - name: Fetch virglrenderer at pinned base
        run: |
          git init -q virgl-src
          git -C virgl-src fetch -q --depth 1 "$VIRGL_UPSTREAM" "$VIRGL_SHA"
          git -C virgl-src checkout -q FETCH_HEAD
          git -C virgl-src config user.email ci@waydroid-nvidia
          git -C virgl-src config user.name ci
          git -C virgl-src am "$GITHUB_WORKSPACE"/patches/virglrenderer/0001-*.patch \
            "$GITHUB_WORKSPACE"/patches/virglrenderer/0002-*.patch \
            "$GITHUB_WORKSPACE"/patches/virglrenderer/0003-*.patch
          git -C virgl-src apply "$GITHUB_WORKSPACE"/patches/virglrenderer/0004-*.patch
      - name: Build virgl_test_server + render server
        run: REPO="$GITHUB_WORKSPACE" ./build/virglrenderer/build.sh "$PWD/virgl-src" "$PWD/virgl-build"
      - name: Stage artifacts
        run: |
          mkdir -p stage
          cp -L virgl-build/vtest/virgl_test_server stage/
          cp -L virgl-build/server/virgl_render_server stage/
          cp -L virgl-build/src/libvirglrenderer.so.1 stage/
      - uses: actions/upload-artifact@v4
        with:
          name: host-venus-server
          path: stage/*
          if-no-files-found: error

  gralloc:
    name: guest gralloc backend (minigbm vtest wrapper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load pins
        run: cat packaging/ci/pins.env | grep -v '^#' >> "$GITHUB_ENV"
      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-ndk
          key: ndk-${{ env.NDK_VERSION }}
      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfLo ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          sha256sum ndk.zip
          if [ -n "$NDK_ZIP_SHA256" ]; then echo "$NDK_ZIP_SHA256  ndk.zip" | sha256sum -c; fi
          unzip -q ndk.zip -d "$HOME"
          mv "$HOME/android-ndk-${NDK_VERSION}" "$HOME/android-ndk"
      - name: Fetch minigbm at pinned base
        run: |
          git init -q minigbm
          git -C minigbm fetch -q --depth 1 "$MINIGBM_UPSTREAM" "$MINIGBM_SHA"
          git -C minigbm checkout -q FETCH_HEAD
      - name: Build libgbm_mesa_wrapper.so
        run: |
          NDK="$HOME/android-ndk" MINIGBM="$PWD/minigbm" \
            ./build/gralloc/build.sh "$PWD/gralloc-out"
          mkdir -p stage/vendor/lib64
          cp -L gralloc-out/libgbm_mesa_wrapper.so stage/vendor/lib64/
      - uses: actions/upload-artifact@v4
        with:
          name: guest-gralloc
          path: stage/
          if-no-files-found: error

  hwcomposer:
    name: guest hwcomposer (clean-room, provision.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load pins
        run: |
          cat packaging/ci/pins.env | grep -v '^#' >> "$GITHUB_ENV"
          cat packaging/ci/hwc-pins.env | grep -v '^#' >> "$GITHUB_ENV"
      - name: Cache NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-ndk
          key: ndk-${{ env.NDK_VERSION }}
      - name: Install NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfLo ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          if [ -n "$NDK_ZIP_SHA256" ]; then echo "$NDK_ZIP_SHA256  ndk.zip" | sha256sum -c; fi
          unzip -q ndk.zip -d "$HOME"
          mv "$HOME/android-ndk-${NDK_VERSION}" "$HOME/android-ndk"
      - name: Host deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq cmake bison flex libssl-dev libjsoncpp-dev pkg-config \
            meson ninja-build libexpat1-dev e2fsprogs unzip zstd xz-utils
      - name: Cache provisioned tree
        uses: actions/cache@v4
        with:
          path: ~/wnv
          key: hwc-wnv-${{ hashFiles('packaging/ci/hwc-pins.env') }}
      - name: Fetch hwcomposer source at pinned base
        run: |
          git init -q hwc-src
          git -C hwc-src fetch -q --depth 1 "$HWC_UPSTREAM" "$HWC_SHA"
          git -C hwc-src checkout -q FETCH_HEAD
          git -C hwc-src apply "$GITHUB_WORKSPACE"/patches/hwcomposer/0001-*.patch
      - name: Provision (clones, hidl-gen, headers, static deps, image libs)
        run: |
          for attempt in 1 2 3; do
            REPO="$GITHUB_WORKSPACE" NDK="$HOME/android-ndk"               ./build/hwcomposer/provision.sh "$HOME/wnv" "$PWD/hwc-src" && break
            echo "::warning::provision attempt $attempt failed, retrying..."
            sleep 10
          done
      - name: Build hwcomposer.waydroid.so
        run: |
          WNV="$HOME/wnv" ROOTFS="$HOME/wnv/image-rootfs" NDK="$HOME/android-ndk" \
            ./build/hwcomposer/build.sh "$PWD/hwc-src/hwcomposer" "$PWD/hwc-out"
          mkdir -p stage/vendor/lib64/hw
          cp hwc-out/hwcomposer.waydroid.stripped.so stage/vendor/lib64/hw/hwcomposer.waydroid.so
      - uses: actions/upload-artifact@v4
        with:
          name: guest-hwcomposer
          path: stage/
          if-no-files-found: error



  waydroid-patch-check:
    name: waydroid patch applies at pinned base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load pins
        run: cat packaging/ci/pins.env | grep -v '^#' >> "$GITHUB_ENV"
      - name: Fetch waydroid, apply patch and validate the dual-ABI mounts
        run: |
          git init -q waydroid
          git -C waydroid fetch -q --depth 1 "$WAYDROID_UPSTREAM" "$WAYDROID_SHA"
          git -C waydroid checkout -q FETCH_HEAD
          git -C waydroid apply "$GITHUB_WORKSPACE"/patches/waydroid/0001-*.patch
          python3 -m compileall -q waydroid/tools
          lxc=waydroid/tools/helpers/lxc.py
          for path in \
            vendor/lib/hw/vulkan.virtio.so \
            vendor/lib/egl/libEGL_angle.so \
            vendor/lib/egl/libGLESv1_CM_angle.so \
            vendor/lib/egl/libGLESv2_angle.so \
            vendor/lib64/hw/vulkan.virtio.so \
            vendor/lib64/egl/libEGL_angle.so \
            vendor/lib64/egl/libGLESv1_CM_angle.so \
            vendor/lib64/egl/libGLESv2_angle.so \
            vendor/lib64/libgbm_mesa_wrapper.so \
            vendor/lib64/hw/hwcomposer.waydroid.so \
            system/bin/surfaceflinger; do
            grep -Fq "\"$path\"" "$lxc"
          done
          if grep -Fq 'vulkan.lvp.so' "$lxc"; then
            echo "::error::Waydroid NVIDIA mounts still reference Lavapipe"
            exit 1
          fi
          echo "waydroid patch and dual-ABI mounts validated at $WAYDROID_SHA"

  release:
    name: release (tarballs + SHA256SUMS + provenance)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mesa, virglrenderer, gralloc, hwcomposer, waydroid-patch-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble tarballs
        run: |
          TAG="${GITHUB_REF_NAME}"
          verify_android_elf() {
            file="$1"
            expected_class="$2"
            expected_machine="$3"
            expected_soname="${4:-}"
            test -f "$file"
            LC_ALL=C readelf -h "$file" | grep -q "Class:.*${expected_class}"
            LC_ALL=C readelf -h "$file" | grep -q "Machine:.*${expected_machine}"
            LC_ALL=C readelf -h "$file" | grep -q 'Type:.*DYN'
            if [ -n "$expected_soname" ]; then
              LC_ALL=C readelf -d "$file" | grep -Fq "Library soname: [$expected_soname]"
            fi
          }
          mkdir -p out
          # host side
          mkdir -p host && cp artifacts/host-venus-server/* host/
          chmod 0755 host/virgl_test_server host/virgl_render_server host/libvirglrenderer.so.1
          tar --zstd -C host -cf "out/waydroid-nvidia-host-x86_64-${TAG}.tar.zst" .
          tar -C host -czf "out/waydroid-nvidia-host-x86_64-${TAG}.tar.gz" .
          # guest app-side drivers (dual ABI)
          mkdir -p guest
          for artifact in guest-vulkan-virtio-x86 guest-vulkan-virtio-x86_64 guest-gralloc; do
            cp -a "artifacts/$artifact"/. guest/
          done
          verify_android_elf guest/vendor/lib/hw/vulkan.virtio.so ELF32 'Intel 80386' libvulkan_virtio.so
          verify_android_elf guest/vendor/lib64/hw/vulkan.virtio.so ELF64 'Advanced Micro Devices X86-64' libvulkan_virtio.so
          verify_android_elf guest/vendor/lib64/libgbm_mesa_wrapper.so ELF64 'Advanced Micro Devices X86-64' libgbm_mesa_wrapper.so
          tar --zstd -C guest -cf "out/waydroid-nvidia-guest-android-x86_64-${TAG}.tar.zst" .
          tar -C guest -czf "out/waydroid-nvidia-guest-android-x86_64-${TAG}.tar.gz" .
          # guest prebuilts: hwcomposer is CI-built here. ANGLE + surfaceflinger
          # need the self-hosted lineage runner; forks without it reuse the last
          # known-good upstream tarball so waydroid-nvidia-setup can actually
          # pass (issues #2 and #5).
          mkdir -p prebuilts
          if [ -d artifacts/guest-hwcomposer ]; then
            cp -a artifacts/guest-hwcomposer/. prebuilts/
          fi
          if [ -d artifacts/guest-angle ] && [ -d artifacts/guest-surfaceflinger ]; then
            cp -a artifacts/guest-angle/. prebuilts/
            cp -a artifacts/guest-surfaceflinger/. prebuilts/
          else
            echo "::warning::ANGLE/surfaceflinger artifacts missing — fetching Shiro836 v0.1.2 fallback"
            curl -fSL -o prebuilts-fallback.tar.zst \
              https://github.com/Shiro836/waydroid-nvidia/releases/download/v0.1.2/waydroid-nvidia-guest-prebuilts-v0.1.2.tar.zst
            echo "61899f56c203b750d41f7c141a1ee264cb68241748cc9cda512ed45f2997cbd1  prebuilts-fallback.tar.zst" | sha256sum -c -
            mkdir -p fallback && tar --zstd -C fallback -xf prebuilts-fallback.tar.zst
            # Keep this job's hwcomposer (NVIDIA patches) over the fallback copy.
            if [ -d artifacts/guest-hwcomposer ]; then
              rm -f fallback/vendor/lib64/hw/hwcomposer.waydroid.so
            fi
            cp -a fallback/. prebuilts/
          fi
          HAVE_PREBUILTS=1
          for need in \
              prebuilts/vendor/lib/egl/libEGL_angle.so \
              prebuilts/vendor/lib64/egl/libEGL_angle.so \
              prebuilts/vendor/lib64/hw/hwcomposer.waydroid.so \
              prebuilts/system/bin/surfaceflinger; do
            [ -f "$need" ] || { echo "::error::prebuilts missing $need"; HAVE_PREBUILTS=0; }
          done
          if [ "$HAVE_PREBUILTS" != 1 ]; then
            echo "::error::refusing to ship a release without guest-prebuilts (issues #2/#5)"
            exit 1
          fi
          if [ "$HAVE_PREBUILTS" = 1 ]; then
            for lib in libEGL_angle.so libGLESv1_CM_angle.so libGLESv2_angle.so; do
              verify_android_elf "prebuilts/vendor/lib/egl/$lib" ELF32 'Intel 80386' "$lib"
              verify_android_elf "prebuilts/vendor/lib64/egl/$lib" ELF64 'Advanced Micro Devices X86-64' "$lib"
            done
            verify_android_elf prebuilts/vendor/lib64/hw/hwcomposer.waydroid.so ELF64 'Advanced Micro Devices X86-64' hwcomposer.waydroid.so
            verify_android_elf prebuilts/system/bin/surfaceflinger ELF64 'Advanced Micro Devices X86-64'
            chmod 0755 prebuilts/system/bin/surfaceflinger
            tar --zstd -C prebuilts -cf "out/waydroid-nvidia-guest-prebuilts-${TAG}.tar.zst" .
            tar -C prebuilts -czf "out/waydroid-nvidia-guest-prebuilts-${TAG}.tar.gz" .
          fi
          # SHA256SUMS always generated from whatever tarballs exist
          (cd out && sha256sum ./*.tar.* > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRE=""; case "$TAG" in *-rc*) PRE="--prerelease" ;; esac
          # Delete stale release from prior failed run (idempotent)
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $PRE             --title "waydroid-nvidia $TAG"             --generate-notes             out/*.tar.* out/SHA256SUMS
